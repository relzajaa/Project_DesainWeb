<!DOCTYPE html>
<html>
<head>
    <title>Margin dan Padding</title>
    <style>
        .satu{
            border: 1px solid black;
            background-color: lightblue;
            /* Ditambahkan margin atas 40px, kanan 50px, bawah 60px, kiri 30px */
            /* Urutan shorthand : atas - kanan - bawah - kiri (searah jarum jam) */
            margin: 40px 50px 60px 30px;
        }
        .dua{
            border: 1px solid black;
            background-color: lightblue;
            /* Ditambahkan padding 40px di semua sisi (atas, kanan, bawah, kiri) */
            padding: 40px;
        }
    </style>
</head>

<body>
    <div class="satu">
        Partisi ini memiliki margin atas 40px, kanan 50px, bawah 60px, kiri 30px.
    </div>

    <div class="dua">
        Sedangkan yang ini memiliki padding atas, kanan, bawah, dan kiri 40px.
    </div>
</body>
</html>
