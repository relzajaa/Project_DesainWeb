<!DOCTYPE html>
<html>
<head>
    <title>Navigasi</title>
    <style>
        ul{
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
        }
        /* Ditambahkan untuk membuat item menu berjajar ke samping (horizontal) */
        li{
            float: left;
            /* Ditambahkan untuk menghilangkan bullet/titik pada daftar */
            list-style-type: none;
        }
        li a{
            color: white;
            text-align: center;
            padding: 14px 16px;
            /* Ditambahkan agar seluruh area padding ikut menjadi area klik/hover */
            display: block;
            /* Ditambahkan untuk menghilangkan garis bawah bawaan link */
            text-decoration: none;
        }
        li a:hover {
            background-color: #111;
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#about">About</a></li>
    </ul>
</body>
</html>
