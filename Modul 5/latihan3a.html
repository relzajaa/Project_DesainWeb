<!DOCTYPE html>
<html>
<head>
    <title>Animasi Transisi CSS 3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style type="text/css">
        .box {
            width: 40%;
            height: 100px;
            background: orange;
            border: 2px solid #212121;
            border-radius: 0;

            -webkit-transition: width 1s ease-in-out, background 1s ease-in-out, border-radius 1s ease-in-out;
            -o-transition: width 1s ease-in-out, background 1s ease-in-out, border-radius 1s ease-in-out;
            -moz-transition: width 1s ease-in-out, background 1s ease-in-out, border-radius 1s ease-in-out;
            transition: width 1s ease-in-out, background 1s ease-in-out, border-radius 1s ease-in-out;
        }

        /* landscape */
        @media (orientation: landscape) {
            .box {
                width: 100%;
                background: blue;
                border-radius: 50%; /* bentuk oval */
            }
        }
    </style>
</head>
<body>
    <h3>Transisi CSS 3</h3>
    <div class="box"></div>
    <p>Ubah orientasi ke landscape/potrait dan sebaliknya untuk melihat efek transisi</p>
</body>
</html>
