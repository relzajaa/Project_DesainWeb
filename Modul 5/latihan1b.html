<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menggunakan Media Query CSS 3</title>

    <style>
        .desktop {
            display: none;
        }

        @media only screen and (min-width: 1024px) {
            body {
                background-color: yellow;
            }
            .desktop {
                display: block;
            }
        }
    </style>

</head>
<body>
    <h3>Menggunakan Media Query CSS 3</h3>
    <div class="desktop">
        <img src="Logo Universitas Sebelas Maret.png" alt="Logo Universitas Sebelas Maret" width="280" height="140">
        <h2>Terdeteksi ukuran desktop</h2>
    </div>
</body>
</html>
