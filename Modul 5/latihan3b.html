<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Animasi Transisi CSS 3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style type="text/css">
        /* Objek berputar bisa keluar dari layar, jadi sembunyikan scrollbar */
        body {
            overflow: hidden;
        }

        .box {
            width: 40%;
            height: 100px;
            background: orange;
            border: 2px solid #212121;
            border-radius: 0;

            /* Transisi lebar, bentuk (oval), dan warna */
            -webkit-transition: width 1s ease-in-out, border-radius 1s ease-in-out, background-color 1s ease-in-out;
            -o-transition: width 1s ease-in-out, border-radius 1s ease-in-out, background-color 1s ease-in-out;
            -moz-transition: width 1s ease-in-out, border-radius 1s ease-in-out, background-color 1s ease-in-out;
            transition: width 1s ease-in-out, border-radius 1s ease-in-out, background-color 1s ease-in-out;
        }

        /* Keyframes untuk berputar 360 derajat */
        @-webkit-keyframes putar {
            from { -webkit-transform: rotate(0deg); }
            to   { -webkit-transform: rotate(360deg); }
        }

        @keyframes putar {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* orientasi landscape */
        @media (orientation: landscape) {
            .box {
                width: 100%;
                background: blue;      /* warna menjadi biru */
                border-radius: 50%;    /* bentuk menjadi oval */

                /* berputar linier, 2 detik per putaran dan tak terbatas */
                -webkit-animation: putar 2s linear infinite;
                animation: putar 2s linear infinite;
            }
        }
    </style>
</head>
<body>
    <h3>Transisi CSS 3</h3>
    <div class="box"></div>
    <p>
        Ubah orientasi ke landscape/potrait dan sebaliknya untuk melihat efek transisi
    </p>
</body>
</html>
