<!DOCTYPE html>
<html>
<head>
    <title>Praktikum Z-index</title>
    <style>
        #layerA{
            position: absolute;
            margin: 20px 150px;
            height: 200px;
            width: 200px;
            background: yellow;
            z-index: 3;
        }

        #layerB{
            position: absolute;
            margin: 100px 0;
            height: 150px;
            width: 300px;
            background: lightblue;
            z-index: 2;
        }

        #layerC{
            position: absolute;
            margin:0 20px;
            height: 200px;
            width: 400px;
            background: red;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="layerA">layer A</div>
    <div id="layerB">layer B</div>
    <div id="layerC">layer C</div>
</body>
</html>
